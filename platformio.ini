; Home Departure Board — PlatformIO config
; Board: Adafruit Matrix Portal S3 driving chained Waveshare P2.5 64x32 panels.
;
;   pio run -e matrixportal_s3 -t upload   USB upload
;   pio run -e ota -t upload               over Wi-Fi; needs secrets.ini
;                                          (copy secrets.example.ini)

[platformio]
default_envs = matrixportal_s3
; Local, git-ignored overrides such as the OTA password. The glob means a
; missing file is simply skipped.
extra_configs = secrets*.ini

[env:matrixportal_s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
; Ports are auto-detected: the board appears on a different COM number in
; ROM bootloader mode (hold BOOT, tap RESET) than when running firmware.

; Two 3.2MB app slots (for OTA) instead of the board default of two 2MB
; slots plus the UF2 bootloader. NVS stays at 0x9000, so settings survive.
board_build.partitions = default_8MB.csv
; Prototypes in src/proto/ have their own env.
build_src_filter = +<*> -<proto/>

lib_deps =
    adafruit/Adafruit Protomatter
    adafruit/Adafruit GFX Library
    tzapu/WiFiManager
    bblanchon/ArduinoJson@^7

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Number of 64x32 panels chained OUT->IN (1, 2 or 3).
    -DPANEL_COUNT=3
    ; Display rotation: 0 = as wired, 2 = 180 degrees (panels mounted upside down).
    -DDISPLAY_ROTATION=2
    ; Hardware brightness ceiling, 0-255. The settings page brightness
    ; (5-100%) scales within this. Keep it low: 3 panels at full white can
    ; exceed the 5V supply. 120 at the default 50% matches the old 60.
    -DBOARD_MAX_BRIGHTNESS=120

; Matter prototype (src/proto/), USB upload only. Re-flash the main
; firmware afterwards with env matrixportal_s3.
[env:matter_proto]
extends = env:matrixportal_s3
build_src_filter = +<proto/>
lib_deps =

; Same firmware, uploaded over Wi-Fi. upload_flags (the password) comes
; from secrets.ini.
[env:ota]
extends = env:matrixportal_s3
upload_protocol = espota
upload_port = departures.local
